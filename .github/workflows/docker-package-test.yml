name: docker-package-test
run-name: Docker package test @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-package-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build linux/amd64 and linux/arm64 without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load validated release metadata
        shell: bash
        run: ./scripts/read_release_manifest.sh release/manifest.env > "$GITHUB_ENV"

      - name: Set up QEMU
        # docker/setup-qemu-action v4.4.0; binfmt qemu-v10.2.3-68
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1; Buildx v0.36.1; BuildKit v0.32.2
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build multi-architecture OCI package
        # docker/build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          provenance: false
          sbom: false
          tags: iosbackup:package-test
          labels: |
            org.opencontainers.image.created=${{ env.IOSBK_BUILD_DATE }}T00:00:00Z
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.IOSBK_SOURCE_URL }}
            org.opencontainers.image.version=${{ env.IOSBK_VERSION }}
          build-args: |
            IOSBK_VERSION=${{ env.IOSBK_VERSION }}
            IOSBK_BUILD_DATE=${{ env.IOSBK_BUILD_DATE }}
            IOSBK_COMMIT=${{ github.sha }}
            IOSBK_SOURCE_URL=${{ env.IOSBK_SOURCE_URL }}
          outputs: type=oci,dest=${{ runner.temp }}/iosbackup-multiarch.oci.tar

      - name: Verify ephemeral OCI package
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/iosbackup-multiarch.oci.tar"
          test -s "$archive"
          tar -xOf "$archive" index.json | jq -e '.schemaVersion == 2 and (.manifests | length > 0)' >/dev/null
