name: docker-package-test
run-name: Docker package test @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-package-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build linux/amd64 and linux/arm64 without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Load validated release metadata
        shell: bash
        run: ./scripts/read_release_manifest.sh release/manifest.env > "$GITHUB_ENV"

      - name: Set up QEMU
        # docker/setup-qemu-action v4.2.0; binfmt qemu-v10.2.3-68
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0; Buildx v0.36.1; BuildKit v0.32.2
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build multi-architecture OCI package
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          provenance: false
          sbom: false
          tags: iosbackup:package-test
          labels: |
            org.opencontainers.image.created=${{ env.IOSBK_BUILD_DATE }}T00:00:00Z
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.IOSBK_SOURCE_URL }}
            org.opencontainers.image.version=${{ env.IOSBK_VERSION }}
          build-args: |
            IOSBK_VERSION=${{ env.IOSBK_VERSION }}
            IOSBK_BUILD_DATE=${{ env.IOSBK_BUILD_DATE }}
            IOSBK_COMMIT=${{ github.sha }}
            IOSBK_SOURCE_URL=${{ env.IOSBK_SOURCE_URL }}
          outputs: type=oci,dest=${{ runner.temp }}/iosbackup-multiarch.oci.tar

      - name: Verify ephemeral OCI package
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/iosbackup-multiarch.oci.tar"
          test -s "$archive"
          tar -xOf "$archive" index.json | jq -e '.schemaVersion == 2 and (.manifests | length > 0)' >/dev/null
