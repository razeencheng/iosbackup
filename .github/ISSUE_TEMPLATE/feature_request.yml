name: Feature request
description: Propose a focused improvement and its safety boundary
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem before the implementation. Features that affect backup compatibility, privileged access, destructive operations, or persisted formats need an explicit migration and safety story.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: This request contains no credentials, device identifiers, pairing records, or backup data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done safely or clearly today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows or workarounds and why they are insufficient.
  - type: textarea
    id: safety
    attributes:
      label: Compatibility and safety considerations
      description: Note effects on existing HTTP/configuration contracts, stored backups, privileges, and feature support boundaries.
    validations:
      required: true
