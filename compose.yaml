services:
  iosbackup:
    image: ${IOSBK_IMAGE:-ghcr.io/razeencheng/iosbackup:v1.5.2}
    container_name: iosbackup
    network_mode: host
    privileged: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=16m,mode=0755
    environment:
      PORT: "${IOSBK_PORT:-9000}"
      LOG_LEVEL: "${IOSBK_LOG_LEVEL:-INFO}"
      IOSBK_LISTEN_ADDR: "0.0.0.0"
      IOSBK_AUTH_ENABLED: "true"
      IOSBK_ADMIN_PASSWORD_FILE: "/configs/admin_password"
      IOSBK_SECRET_KEY: "${IOSBK_SECRET_KEY:?set IOSBK_SECRET_KEY to base64-encoded 32 bytes}"
      IOSBK_CONFIGS_DIR: "/configs"
      IOSBK_BACKUPS_DIR: "/backups"
      IOSBK_DEVICE_DISCONNECT_GRACE: "${IOSBK_DEVICE_DISCONNECT_GRACE:-30s}"
      IOSBK_ENABLE_EXPERIMENTAL_OPERATIONS: "${IOSBK_ENABLE_EXPERIMENTAL_OPERATIONS:-false}"
    volumes:
      - ./data/backups:/backups
      - ./data/configs:/configs
      - ./data/lockdown:/var/lib/lockdown
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"
