services:
  iosbackup:
    image: ghcr.io/razeencheng/iosbackup:latest
    container_name: iosbackup
    network_mode: host
    privileged: true
    restart: unless-stopped
    stop_grace_period: 20s
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=16m,mode=0755
    environment:
      PORT: "9000"
      LOG_LEVEL: "INFO"
      IOSBK_LISTEN_ADDR: "0.0.0.0"
      IOSBK_AUTH_ENABLED: "true"
      # 默认自动生成密码和主密钥；仅在需要自定义凭据时设置以下选项。
      IOSBK_ADMIN_PASSWORD_FILE: "${IOSBK_ADMIN_PASSWORD_FILE:-}"
      IOSBK_SECRET_KEY: "${IOSBK_SECRET_KEY:-}"
      IOSBK_SECRET_KEY_FILE: "${IOSBK_SECRET_KEY_FILE:-}"
      IOSBK_CONFIGS_DIR: "/configs"
      IOSBK_BACKUPS_DIR: "/backups"
      IOSBK_DEVICE_DISCONNECT_GRACE: "30s"
      IOSBK_ENABLE_EXPERIMENTAL_OPERATIONS: "false"
    volumes:
      - ./data/backups:/backups
      - ./data/configs:/configs
      - ./data/lockdown:/var/lib/lockdown
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"
